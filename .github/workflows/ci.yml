name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      # Live tests are deselected by addopts, so no OPENROUTER_API_KEY is needed here.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      # The API serves this export, so a build that fails is a broken app, not just a
      # broken bundle. next/font/google downloads the fonts, so this step needs network.
      - run: npm run build

  # Playwright is deliberately not here: chat.spec.ts drives the real model, so it
  # needs a key and takes minutes. Run it locally with npm run test:e2e.
