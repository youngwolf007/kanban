[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management MVP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "itsdangerous",
    "openai>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests hit the real OpenRouter API, so they are deselected by default.
# Run them with: uv run pytest -m live
markers = ["live: calls OpenRouter for real; needs OPENROUTER_API_KEY"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 95

[tool.ruff.lint]
# E, F and I are the substance: real errors, unused names, and import order. Bugbear's
# B008 fires on every `Depends(...)` default, which is FastAPI's own idiom, so the rest
# of the default set costs more noise than it catches here. UP checks syntax modernity,
# not type correctness — no type checker is configured, so every annotation in the
# codebase is documentation, not an enforced contract.
select = ["E", "F", "I", "UP"]
