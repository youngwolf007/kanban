[project]
name = "pm-backend"
version = "0.1.0"
description = "Project Management MVP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "itsdangerous",
    "openai>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests hit the real OpenRouter API, so they are deselected by default.
# Run them with: uv run pytest -m live
markers = ["live: calls OpenRouter for real; needs OPENROUTER_API_KEY"]
addopts = "-m 'not live'"
